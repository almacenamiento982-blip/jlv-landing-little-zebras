<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Little Zebras · Juventus Academy Las Vegas</title>
<meta name="description" content="Little Zebras by Juventus Academy Las Vegas: fun first steps in soccer for boys and girls ages 3 to 5, every Thursday. No experience needed. Register online.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"Juventus Fans";src:url("assets/jfans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--negro:#0b0b0c;--negro2:#151517;--oro:#a87a2d;--oro2:#c49a4f;--crema:#f5f0e7;--tinta:#1a1a1c;--gris:#5d5a55;--linea:#e4ddd0;
  --tit:"Juventus Fans","Barlow Condensed","Arial Narrow",sans-serif;--txt:"Barlow",system-ui,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--tinta);font:17px/1.55 var(--txt);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--tit);font-weight:700;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.5px;text-wrap:balance}
.eyebrow{font:600 13px/1 var(--txt);letter-spacing:3px;text-transform:uppercase;color:var(--oro2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1 var(--txt);letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border:0;border-radius:6px;padding:18px 28px;cursor:pointer;transition:transform .15s,background .15s}
.btn-oro{background:var(--oro);color:#fff;box-shadow:0 10px 24px -10px rgba(168,122,45,.8)}
.btn-oro:hover{background:#946a24;transform:translateY(-1px)}
.btn-sec{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:16px 22px;font-size:14px}
.btn-sec:hover{background:rgba(255,255,255,.16)}
.flecha{font-size:20px;line-height:0}

/* barra superior */
.top{position:absolute;inset:0 0 auto 0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:82px}
.top img{height:50px;width:auto}
.idioma{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
.idioma button{font:700 12px/1 var(--txt);letter-spacing:1px;color:#fff;background:transparent;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.idioma button[aria-pressed=true]{background:#fff;color:var(--negro)}

/* portada: video horizontal a todo lo ancho (PC) / video arriba y texto debajo (celular) */
.hero{position:relative;background:var(--negro);color:#fff;display:grid;overflow:hidden}
.hero-media{position:relative;height:min(52svh,470px)}
.hero-media img,.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero-media video{opacity:0;transition:opacity .6s}.hero-media video.lista{opacity:1}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 22%,rgba(11,11,12,0) 55%,var(--negro) 100%)}
.hero-txt{position:relative;z-index:2;padding:0 20px 36px;margin-top:-80px}
.hero h1{font-size:clamp(50px,7.6vw,118px);margin:12px 0 16px}
.hero h1 em{font-style:normal;color:var(--oro2)}
.hero .sub{max-width:580px;font-size:clamp(17px,1.6vw,20px);color:#ece8e1;margin:0 0 20px}
.hero-datos{display:grid;grid-template-columns:repeat(3,auto);width:fit-content;max-width:100%;margin:0 0 22px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(11,11,12,.5);backdrop-filter:blur(6px)}
.hero-datos div{padding:12px 20px;border-left:1px solid rgba(255,255,255,.14)}.hero-datos div:first-child{border-left:0}
.hero-datos small{display:block;font:700 11px/1 var(--txt);letter-spacing:2px;text-transform:uppercase;color:var(--oro2);margin-bottom:7px}
.hero-datos b{font:600 17px/1.2 var(--txt);color:#fff}
.acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-flex;width:fit-content;align-items:center;gap:8px;background:#fff;color:var(--negro);font:700 13px/1.2 var(--txt);letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border-radius:6px;margin-bottom:16px}
.cinta{position:relative;z-index:3;background:var(--oro);color:var(--negro);overflow:hidden;white-space:nowrap;padding:13px 0 11px}
.cinta-pista{display:inline-flex;animation:cinta 40s linear infinite}
.cinta-pista span{font:700 22px/1 var(--tit);text-transform:uppercase;letter-spacing:1px;padding-inline:18px}
.cinta-pista i{font-style:normal;color:#fff;font-size:16px;align-self:center}
@keyframes cinta{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.cinta-pista{animation:none}.hero-media video{display:none}}
@media (min-width:901px){
  .hero{display:block;min-height:min(900px,100svh)}
  .hero-media{position:absolute;inset:0;height:auto}
  .hero-media img,.hero-media video{object-position:72% 50%}
  .hero-media::after{background:linear-gradient(90deg,rgba(11,11,12,.9) 0%,rgba(11,11,12,.64) 32%,rgba(11,11,12,.08) 60%,rgba(11,11,12,0) 78%),linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 20%,rgba(11,11,12,0) 72%,rgba(11,11,12,.55) 100%)}
  .hero-txt{margin:0;min-height:calc(min(900px,100svh) - 46px);max-width:calc(max(20px,(100vw - 1180px)/2 + 20px) + 760px);display:flex;flex-direction:column;justify-content:center;padding:110px 40px 64px max(20px,calc((100vw - 1180px)/2 + 20px))}
  .cinta{position:absolute;left:0;right:0;bottom:0}
}

/* secciones */
.sec{padding-block:84px}
.sec-tit{display:flex;flex-direction:column;gap:12px;margin-bottom:34px}
.sec-tit h2{font-size:clamp(40px,5.4vw,64px)}
.sec-tit p{max-width:640px;margin:0;color:var(--gris)}
.sec-tit .eyebrow{color:var(--oro)}
.crema{background:var(--crema)}
.oscuro{background:var(--negro);color:#fff}
.oscuro .sec-tit p{color:#cfc8bb}
.oscuro .sec-tit .eyebrow{color:var(--oro2)}

/* cómo es una clase */
.clase{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.clase-lista{display:grid;gap:22px}
.item{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:start}
.item .n{font:700 44px/1 var(--tit);color:var(--oro)}
.item b{font:700 26px/1.05 var(--tit);text-transform:uppercase;display:block;margin-bottom:6px}
.item p{margin:0;color:var(--gris);font-size:16px}
.clase-fotos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clase-fotos img{width:100%;height:300px;object-fit:cover;border-radius:12px}
.clase-fotos img:first-child{grid-column:1/-1;height:330px;object-position:50% 22%}

/* razones */
.porque{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.razon{border-top:3px solid var(--oro);padding-top:18px}
.razon b{font-family:var(--tit);font-size:30px;line-height:1;text-transform:uppercase;display:block;margin-bottom:10px}
.razon p{margin:0;color:var(--gris);font-size:16px}

/* horario y lugar */
.panel{display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border:1px solid var(--linea);border-radius:16px;overflow:hidden}
.panel-info{padding:34px}
.panel-info h3{font-size:52px;margin-bottom:6px}
.panel-info .lugar{color:var(--gris);margin:0 0 22px}
.panel-info .lugar a{color:var(--oro);font-weight:600}
.fila{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--linea)}
.fila .k{flex:0 0 120px;font:700 12px/1.6 var(--txt);letter-spacing:1.5px;text-transform:uppercase;color:var(--oro)}
.precio small{color:var(--gris);display:block;font-size:14px}
.panel-foto{position:relative;min-height:420px}
.panel-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel .acciones{margin-top:22px}

/* pasos */
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:p}
.paso{background:var(--negro2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:28px;counter-increment:p}
.paso::before{content:counter(p);font-family:var(--tit);font-size:72px;line-height:.8;color:var(--oro2);display:block;margin-bottom:14px}
.paso h3{font-size:30px;margin-bottom:10px}
.paso p{margin:0;color:#d8d2c7;font-size:16px}
.paso .pkg{display:block;margin-top:12px;background:rgba(168,122,45,.16);border:1px dashed var(--oro2);border-radius:8px;padding:10px 12px;font:600 14px/1.4 var(--txt);color:#fff}
.pasos-cta{margin-top:30px}

/* preguntas */
.faq{max-width:860px}
.faq details{border-top:1px solid var(--linea);padding:18px 0}
.faq details:last-child{border-bottom:1px solid var(--linea)}
.faq summary{list-style:none;cursor:pointer;font:600 19px/1.35 var(--txt);display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 28px/1 var(--txt);color:var(--oro)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:12px 0 0;color:var(--gris)}
.faq a{color:var(--oro);font-weight:600}

/* cierre y pie */
.cierre{position:relative;color:#fff;background:var(--negro);overflow:hidden}
.cierre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%;opacity:.42}
.cierre .wrap{position:relative;padding-block:110px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.cierre h2{font-size:clamp(46px,7vw,92px);max-width:900px}
.cierre p{margin:0;max-width:560px;color:#ece8e1}
.pie{background:#050505;color:#a8a296;font-size:14px}
.pie .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-block:34px}
.pie img{height:44px;width:auto}
.pie a{color:#e6dfd2;text-decoration:none}

/* barra fija en el celular */
.fija{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(11,11,12,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1)}
.fija .btn{width:100%;padding:16px 10px;font-size:15px}

/* revisión (solo con ?revision) */
.rev{position:fixed;right:14px;top:96px;z-index:30;background:#fff;border:2px solid var(--oro);border-radius:12px;padding:14px;font-size:13px;width:250px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4)}
.rev b{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro);margin-bottom:8px}
.rev label{display:flex;align-items:center;gap:8px;margin:6px 0}

@media (max-width:900px){
  .clase{grid-template-columns:1fr}.clase-fotos{order:-1}
  .porque{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr}.panel-foto{min-height:260px;order:-1}
  .pasos{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding-inline:16px}
  .top img{height:40px}
  .hero-txt{padding:0 16px 30px;margin-top:-70px}
  .hero .eyebrow{font-size:11px;letter-spacing:1.6px}
  .hero-datos{grid-template-columns:repeat(3,1fr);width:auto}.hero-datos div{padding:10px 11px}
  .hero-datos small{font-size:10px;letter-spacing:1.2px}.hero-datos b{font-size:14px}
  .acciones .btn{width:100%}
  .sec{padding-block:60px}
  .clase-fotos img{height:180px}.clase-fotos img:first-child{height:220px}
  .panel-info{padding:24px 20px}.panel-info h3{font-size:40px}
  .fila{flex-direction:column;gap:6px}.fila .k{flex:none}
  .fija{display:block}
  .pie{padding-bottom:84px}
  .rev{top:auto;bottom:90px;right:10px;width:220px}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <img src="assets/img/logo_LV_blanco.png" alt="Juventus Academy Las Vegas" width="556" height="274">
  <div class="idioma" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
</div></header>

    <video id="hero-video" muted loop playsinline preload="none"></video>
  </div>
  <div class="hero-txt">
    <div class="eyebrow" data-t="eyebrow"></div>

    <div class="badge" data-t="badge"></div>
    <div class="hero-datos">

</section>

<section class="sec" id="clase"><div class="wrap clase">

    <div class="sec-tit"><div class="eyebrow" data-t="clase_eb"></div><h2 data-t="clase_h"></h2><p data-t="clase_p"></p></div>

    <img src="assets/img/foto_3.jpg" alt="" loading="lazy" data-alt="alt3">
  </div>
</div></section>

<section class="sec crema" id="porque"><div class="wrap">
  <div class="sec-tit"><div class="eyebrow" data-t="por_eb"></div><h2 data-t="por_h"></h2></div>
  <div class="porque">
    <div class="razon"><b data-t="r1h"></b><p data-t="r1"></p></div>
    <div class="razon"><b data-t="r2h"></b><p data-t="r2"></p></div>
    <div class="razon"><b data-t="r3h"></b><p data-t="r3"></p></div>
  </div>
</div></section>

<section class="sec" id="horario"><div class="wrap">
  <div class="sec-tit"><div class="eyebrow" data-t="hor_eb"></div><h2 data-t="hor_h"></h2></div>
  <div class="panel">
    <div class="panel-info">
      <h3>Little Zebras</h3>
      <p class="lugar" id="lugar"></p>
      <div class="fila"><div class="k" data-t="k_cuando"></div><div data-t="v_cuando"></div></div>
      <div class="fila"><div class="k" data-t="k_quien"></div><div data-t="v_quien"></div></div>
      <div class="fila"><div class="k" data-t="k_temporada"></div><div data-t="v_temporada"></div></div>
      <div class="fila" id="fila-precio"><div class="k" data-t="k_precio"></div><div class="precio" id="precio"></div></div>
      <div class="acciones"><a class="btn btn-oro" data-registro href="#"><span data-t="cta"></span><span class="flecha">→</span></a></div>
    </div>
    <div class="panel-foto"><img src="assets/img/foto_4.jpg" alt="" loading="lazy" data-alt="alt4"></div>
  </div>
</div></section>

<section class="sec oscuro" id="registro"><div class="wrap">
  <div class="sec-tit"><div class="eyebrow" data-t="pasos_eb"></div><h2 data-t="pasos_h"></h2><p data-t="pasos_p"></p></div>
  <div class="pasos">
    <div class="paso"><h3 data-t="p1h"></h3><p data-t="p1"></p></div>
    <div class="paso"><h3 data-t="p2h"></h3><p data-t="p2"></p></div>
    <div class="paso"><h3 data-t="p3h"></h3><p data-t="p3"></p></div>
  </div>
  <div class="pasos-cta"><a class="btn btn-oro" data-registro href="#"><span data-t="cta"></span><span class="flecha">→</span></a></div>
</div></section>

<section class="sec crema" id="preguntas"><div class="wrap">
  <div class="sec-tit"><div class="eyebrow" data-t="faq_eb"></div><h2 data-t="faq_h"></h2></div>
  <div class="faq" id="faq"></div>
</div></section>

<section class="cierre">
  <img src="assets/img/foto_5.jpg" alt="" loading="lazy">
  <div class="wrap">
    <h2 data-t="cierre_h"></h2>
    <p data-t="cierre_p"></p>
    <div class="acciones" style="justify-content:center"><a class="btn btn-oro" data-registro href="#"><span data-t="cta"></span><span class="flecha">→</span></a></div>
  </div>
</section>

<footer class="pie"><div class="wrap">
  <img src="assets/img/logo_LV_blanco.png" alt="Juventus Academy Las Vegas" width="556" height="274" loading="lazy">
  <div><a href="https://jacademylasvegas.com/" target="_blank" rel="noopener">jacademylasvegas.com</a> · <a href="https://www.instagram.com/jacademylasvegas/" target="_blank" rel="noopener">Instagram @jacademylasvegas</a></div>
  <div style="width:100%">© Soccer Cage LLC · Juventus Academy Las Vegas</div>
</div></footer>

const qs = new URLSearchParams(location.search);
const leer = k => { try { return localStorage.getItem('lz_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('lz_' + k, v); } catch (e) {} };
let lang = qs.get('lang') || leer('lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function enlace() {   // UTM del anuncio → PlayMetrics, para saber de dónde vino cada inscripción
  const u = new URL(CFG.playmetrics);
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(k => { if (qs.get(k)) u.searchParams.set(k, qs.get(k)); });
  return u.toString();
}

function pintar() {
  const t = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  document.querySelectorAll('[data-alt]').forEach(el => { el.alt = t[el.dataset.alt]; });
  document.querySelectorAll('.idioma button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  const fila = t.cinta.map(x => `<span>${esc(x)}</span><i>★</i>`).join('');
  document.getElementById('cinta').innerHTML = fila + fila;
  document.getElementById('clase-lista').innerHTML = t.clase.map((c, i) => `<div class="item"><span class="n">0${i + 1}</span><div><b>${esc(c[0])}</b><p>${esc(c[1])}</p></div></div>`).join('');
  document.getElementById('lugar').innerHTML = `${esc(CFG.lugar)} · ${esc(CFG.dir)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CFG.lugar + ', ' + CFG.dir)}" target="_blank" rel="noopener">${t.mapa}</a>`;
  document.getElementById('fila-precio').hidden = !CFG.precios;
  document.getElementById('precio').innerHTML = `${esc(t.precio)}<small>${esc(t.precio_nota)}</small>`;
  document.getElementById('faq').innerHTML = t.faq.map(f => `<details><summary>${esc(f[0])}</summary><p>${f[1]}</p></details>`).join('');
  document.querySelectorAll('[data-registro]').forEach(a => { a.href = enlace(); a.target = '_blank'; a.rel = 'noopener'; });
}

document.addEventListener('click', e => {
  const b = e.target.closest('.idioma button');
  if (b) { lang = b.dataset.lang; guardar('lang', lang); pintar(); return; }
  if (e.target.closest('[data-registro]')) {   // Lead: en WordPress ya lo manda el WPCode 8150 al tocar un enlace de PlayMetrics
    if (CFG.pixel && window.fbq) fbq('track', 'Lead', { content_name: 'Little Zebras' });
    if (window.gtag) gtag('event', 'generate_lead', { program: 'little_zebras' });
  }
});

/* panel de revisión (solo con ?revision) */
if (qs.has('revision')) {
  const r = document.createElement('div'); r.className = 'rev';
  r.innerHTML = `<b>Vista de revisión</b><label><input type="checkbox" id="rv-pre"> Mostrar precio (USD 480)</label><div style="color:#5d5a55;font-size:12px;margin-top:8px">El precio está apagado hasta confirmar cuánto paga quien entra ahora.</div>`;
  document.body.appendChild(r);
  r.querySelector('#rv-pre').onchange = e => { CFG.precios = e.target.checked; pintar(); };
}
pintar();

/* portada en video: horizontal en el computador, vertical en el celular */
(function () {
  const pc = matchMedia('(min-width:901px)').matches, v = document.getElementById('hero-video');
  document.getElementById('hero-poster').src = 'assets/img/' + (pc ? 'hero_poster_pc.jpg' : 'hero_poster_movil.jpg');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  v.src = 'assets/video/' + (pc ? 'hero_pc.mp4' : 'hero_movil.mp4');
  v.addEventListener('playing', () => v.classList.add('lista'), { once: true });
  v.addEventListener('canplay', () => v.play().catch(() => {}), { once: true }); v.play().catch(() => {});
})();
</script>
